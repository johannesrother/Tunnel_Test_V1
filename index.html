<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#030405">
    <meta name="description" content="Tunnel Test V3 — a 60-second WebXR architectural experience.">
    <title>Tunnel Test V3</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Babylon.js is intentionally loaded directly from its CDN: no build tool is required. -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
  </head>
  <body>
    <canvas id="experience-canvas" aria-label="Tunnel Test V3 immersive experience"></canvas>

    <!-- A user gesture is necessary for browser audio and optional WebXR entry. -->
    <section id="entry-gate" aria-label="Enter experience">
      <p class="eyebrow">TUNNEL TEST V3</p>
      <h1>60 seconds</h1>
      <p class="instruction">Use a headset for immersive mode. Head movement is the only interaction.</p>
      <button id="begin-button" type="button" disabled>PREPARING</button>
    </section>

    <!-- A blank white veil completes the final silent fade; it contains no text or UI. -->
    <section id="ending" aria-hidden="true"></section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
